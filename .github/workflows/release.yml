name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Publish as Pre-release?'
        required: false
        type: boolean
        default: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Release Variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ inputs.version }}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=${{ inputs.prerelease }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' 

      - name: Build All Artifacts
        run: |
          chmod +x build_installers.sh
          ./build_installers.sh

      - name: Zip Extensions
        run: |
          cd release
          
          cd extension-chrome
          zip -r ../extension-chrome.zip .
          cd ..
          
          cd extension-firefox
          zip -r ../extension-firefox.zip .
          cd ..
          
          cd ..

      - name: Generate Release Notes
        run: |
          # Read the template
          CONTENT=$(cat .github/release_template.md)
          # Replace 'v1.0.0' with the actual tag name
          echo "${CONTENT//v1.0.0/$TAG_NAME}" > RELEASE_BODY.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          files: |
            release/homa-installer-windows.exe
            release/homa-installer-linux-amd64
            release/homa-installer-darwin-amd64
            release/homa-installer-darwin-arm64
            release/extension-chrome.zip
            release/extension-firefox.zip
